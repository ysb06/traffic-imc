paths:
  path_config_file: ../path_config.yaml

model:
  name: dcrnn
  params:
    rnn_units: 64
    num_rnn_layers: 2
    max_diffusion_step: 2
    filter_type: dual_random_walk
    use_curriculum_learning: true
    cl_decay_steps: 2000
    learning_rate: 0.01
    weight_decay: 0.0
    adam_epsilon: 1.0e-3
    lr_decay_ratio: 0.1
    lr_decay_steps: [20, 30, 40, 50]
    min_learning_rate: 2.0e-6

data:
  params:
    train_val_split: 0.8
    seq_len: 24
    horizon: 24
    batch_size: 64
    num_workers: 2
    shuffle_training: false
    add_time_in_day: true
    add_day_in_week: false

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  resume_ckpt_path: null

runtime:
  accelerator: null
  devices: null
  cpu_num_threads: null
  cpu_num_interop_threads: null
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
