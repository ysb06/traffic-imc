paths:
  path_config_file: ../path_config.yaml

model:
  name: bigst
  params:
    input_dim: 3
    output_dim: 1
    hid_dim: 32
    num_layers: 3
    tau: 0.25
    random_feature_dim: 64
    node_dim: 32
    time_dim: 32
    time_num: 24
    week_num: 7
    dropout: 0.3
    use_residual: true
    use_bn: true
    use_spatial: true
    spatial_loss_weight: 0.3
    learning_rate: 0.001
    weight_decay: 0.0001
    adam_epsilon: 1.0e-8
    milestones: [80, 100]
    gamma: 0.1

data:
  params:
    train_val_split: 0.8
    input_length: 24
    output_length: 24
    batch_size: 16
    num_workers: 2
    shuffle_training: false

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  resume_ckpt_path: null

runtime:
  accelerator: null
  devices: null
  cpu_num_threads: null
  cpu_num_interop_threads: null
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
