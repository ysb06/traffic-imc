paths:
  path_config_file: ../path_config.yaml

model:
  name: lstm
  params:
    input_size: 1
    hidden_size: 64
    num_layers: 2
    output_size: 24
    learning_rate: 0.001
    weight_decay: 0.0
    dropout_rate: 0.2
    scheduler_factor: 0.5
    scheduler_patience: 5

data:
  params:
    train_val_split: 0.8
    seq_length: 24
    pred_length: 24
    batch_size: 512
    num_workers: 2
    shuffle_training: false
    allow_nan: false

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 1.0
  resume_ckpt_path: null

runtime:
  accelerator: cpu
  devices: 1
  cpu_num_threads: 40
  cpu_num_interop_threads: 1
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
