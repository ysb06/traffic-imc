paths:
  path_config_file: ../path_config.yaml

model:
  name: mtgnn
  params:
    input_dim: 2
    output_dim: 1
    gcn_true: true
    buildA_true: true
    gcn_depth: 2
    dropout: 0.3
    subgraph_size: 20
    node_dim: 40
    dilation_exponential: 1
    conv_channels: 32
    residual_channels: 32
    skip_channels: 64
    end_channels: 128
    layers: 3
    propalpha: 0.05
    tanhalpha: 3
    layer_norm_affine: true
    learning_rate: 0.001
    weight_decay: 0.0001

data:
  params:
    train_val_split: 0.8
    seq_len: 24
    horizon: 24
    batch_size: 64
    num_workers: 2
    shuffle_training: false
    add_time_in_day: true
    add_day_in_week: false

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  resume_ckpt_path: null

runtime:
  accelerator: null
  devices: null
  cpu_num_threads: null
  cpu_num_interop_threads: null
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
