paths:
  path_config_file: ../path_config.yaml

model:
  name: stgcn
  params:
    learning_rate: 0.001
    weight_decay: 0.0
    rmsprop_alpha: 0.9
    rmsprop_epsilon: 1.0e-10
    lr_decay_step: 5
    lr_decay_rate: 0.7
    dropout_rate: 0.5
    Kt: 3
    stblock_num: 2
    Ks: 3
    act_func: glu
    graph_conv_type: graph_conv
    gso_type: rw_norm_lap
    force_symmetric: false
    enable_bias: true

data:
  params:
    train_val_split: 0.8
    n_his: 24
    n_pred: 24
    batch_size: 50
    num_workers: 2
    shuffle_training: false

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  resume_ckpt_path: null

runtime:
  accelerator: null
  devices: null
  cpu_num_threads: null
  cpu_num_interop_threads: null
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
