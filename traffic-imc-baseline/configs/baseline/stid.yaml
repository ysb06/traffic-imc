paths:
  path_config_file: ../path_config.yaml

model:
  name: stid
  params:
    input_dim: 3
    output_dim: 1
    embed_dim: 32
    num_layer: 3
    if_node: true
    node_dim: 32
    if_time_in_day: true
    if_day_in_week: true
    temp_dim_tid: 32
    temp_dim_diw: 32
    time_of_day_size: 24
    day_of_week_size: 7
    learning_rate: 0.002
    weight_decay: 1e-4
    milestones: [1, 50, 80]
    gamma: 0.5

data:
  params:
    train_val_split: 0.8
    in_steps: 24
    out_steps: 24
    batch_size: 64
    num_workers: 2
    shuffle_training: false
    target_sensors: null

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  resume_ckpt_path: null

runtime:
  accelerator: null
  devices: null
  cpu_num_threads: null
  cpu_num_interop_threads: null
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
