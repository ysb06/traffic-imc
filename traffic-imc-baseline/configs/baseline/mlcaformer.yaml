paths:
  path_config_file: ../path_config.yaml

model:
  name: mlcaformer
  params:
    input_dim: 3
    output_dim: 1
    input_embedding_dim: 24
    tod_embedding_dim: 24
    dow_embedding_dim: 24
    nid_embedding_dim: 24
    col_embedding_dim: 80
    feed_forward_dim: 256
    num_heads: 8
    num_layers: 3
    dropout: 0.1
    learning_rate: 0.001
    weight_decay: 0.0003
    adam_epsilon: 1.0e-8
    # milestones: [15, 30, 50]
    milestones: [30, 60, 90]
    lr_decay_rate: 0.1

data:
  params:
    train_val_split: 0.8
    in_steps: 24
    out_steps: 24
    steps_per_day: 24
    batch_size: 16
    num_workers: 2
    shuffle_training: false

run:
  name: Baseline
  code: 0
  seed: null

trainer:
  max_epochs: 100
  gradient_clip_val: 5.0
  resume_ckpt_path: null

runtime:
  accelerator: null
  devices: null
  cpu_num_threads: null
  cpu_num_interop_threads: null
  float32_matmul_precision: null

callbacks:
  early_stopping:
    enabled: true
    patience: 10

logging:
  type: wandb
  project: Traffic-IMC-CIKM
  save_dir: ./logs
  log_model: all
