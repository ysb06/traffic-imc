# Raw data paths configuration
root_dir: "./datasets/traffic-imc"

# Core files
dataset:
  dir: "."
  filenames:
    traffic_imc: "traffic-imc.h5"
    traffic_imc_missing: "traffic-imc-missing.h5"
    traffic_imc_training: "traffic-imc-training.h5"
    traffic_imc_training_missing: "traffic-imc-training-missing.h5"
    traffic_imc_test: "traffic-imc-test.h5" 
    traffic_imc_test_missing: "traffic-imc-test-missing.h5"
    sensor_ids: "metr_ids.txt"
    metadata: "metadata.h5"
    sensor_locations: "graph_sensor_locations.csv"
    distances: "distances_imc.csv"
    adjacency_matrix: "adj_mx.pkl"

# Nodelink data
nodelink:
  dir: "nodelink"
  filenames:
    node: "imc_node.shp"
    link: "imc_link.shp"
    turn: "imc_turninfo.dbf"

# IMCRTS data
imcrts:
  dir: "imcrts"
  filenames:
    data: "imcrts_data.pkl"

# Miscellaneous files
misc:
  dir: "miscellaneous"
  filenames:
    imcrts_excel: "imcrts_data.xlsx"
    traffic_excel: "traffic-imc.xlsx"
    traffic_shape: "traffic_imc.shp"
    distances_shape: "distances_imc.shp"