[project]
name = "traffic-imc-dataset"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "Seungbin Yim", email = "sbyim@stanford.edu" }]
dependencies = [
    "torch>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "pypots>=1.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "networkx>=3.2.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "tables>=3.9.0",
    "openpyxl>=3.1.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
traffic-imc-dataset = "traffic_imc_dataset.__main__:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
